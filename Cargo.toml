[workspace]
members = ["crates/tauri-plugin-update-gate"]
resolver = "2"

[workspace.package]
version = "0.1.0-alpha.1"
edition = "2021"
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/hoangmirs/tauri-plugins"

[workspace.dependencies]
async-trait = "=0.1.92"
log = "=0.4.34"
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls", "json"] }
semver = "=1.0.28"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tauri = { version = "=2.11.5", default-features = false }
thiserror = "=2.0.20"
tokio = { version = "=1.53.1", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
