[package]
name = "tauri-plugin-ads"
description = "Tauri plugin that shows Google Mobile Ads native ads over a page slot, and rewarded ads, on iOS and Android"
version = "0.1.0-alpha.2"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
documentation = "https://docs.rs/tauri-plugin-ads"
readme = "../../README.md"
keywords = ["tauri", "tauri-plugin", "ads", "admob", "native-ads"]
categories = ["gui"]
links = "tauri-plugin-ads"

[dependencies]
serde.workspace = true
serde_json.workspace = true
tauri.workspace = true

[build-dependencies]
tauri-plugin = { version = "2.6.3", features = ["build"] }

[dev-dependencies]
tempfile.workspace = true
tauri = { workspace = true, features = ["test"] }

[lints]
workspace = true
