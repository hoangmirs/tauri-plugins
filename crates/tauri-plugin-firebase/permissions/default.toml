[default]
description = "Read Remote Config, set its custom signals and hear its publishes, log Analytics events and send crash reports"
permissions = [
  "allow-mode",
  "allow-set-defaults",
  "allow-fetch",
  "allow-activate",
  "allow-get-all",
  "allow-listen",
  "allow-unlisten",
  "allow-register-listener",
  "allow-remove-listener",
  "allow-set-custom-signals",
  "allow-log-event",
  "allow-set-collection",
  "allow-crash-set-collection",
  "allow-crash-set-keys",
  "allow-crash-log",
  "allow-crash-record",
]
