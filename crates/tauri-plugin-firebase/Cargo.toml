[package]
name = "tauri-plugin-firebase"
description = "Tauri plugin that reads Firebase Remote Config, logs Firebase Analytics events and sends Crashlytics reports, with defaults wherever Firebase is absent"
version = "0.1.0-alpha.2"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
documentation = "https://docs.rs/tauri-plugin-firebase"
readme = "../../README.md"
keywords = ["tauri", "tauri-plugin", "firebase", "remote-config", "analytics", "crashlytics"]
categories = ["gui"]
links = "tauri-plugin-firebase"

[dependencies]
serde.workspace = true
serde_json.workspace = true
tauri.workspace = true

[build-dependencies]
tauri-plugin = { version = "2.6.3", features = ["build"] }

[dev-dependencies]
tempfile.workspace = true
tauri = { workspace = true, features = ["test"] }

[lints]
workspace = true
