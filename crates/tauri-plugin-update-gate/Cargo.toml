[package]
name = "tauri-plugin-update-gate"
description = "Tauri plugin that reads a JSON document over HTTP and tells an app whether the installed copy is too old to run"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
documentation = "https://docs.rs/tauri-plugin-update-gate"
readme = "../../README.md"
keywords = ["tauri", "tauri-plugin", "update", "version", "force-update"]
categories = ["gui", "web-programming::http-client"]
links = "tauri-plugin-update-gate"

[dependencies]
async-trait.workspace = true
log.workspace = true
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri.workspace = true
ureq.workspace = true

[build-dependencies]
tauri-plugin = { version = "2.6.3", features = ["build"] }

[dev-dependencies]
tauri = { workspace = true, features = ["test"] }
tokio = { workspace = true, features = ["macros", "rt"] }

[lints]
workspace = true
