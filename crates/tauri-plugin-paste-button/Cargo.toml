[package]
name = "tauri-plugin-paste-button"
description = "Tauri plugin that lays the system paste button over a box the page draws, on iOS"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
documentation = "https://docs.rs/tauri-plugin-paste-button"
readme = "../../README.md"
keywords = ["tauri", "tauri-plugin", "ios", "paste", "clipboard"]
categories = ["gui"]
links = "tauri-plugin-paste-button"

[dependencies]
serde.workspace = true
tauri.workspace = true

[build-dependencies]
tauri-plugin = { version = "2.6.3", features = ["build"] }

[dev-dependencies]
serde_json.workspace = true
tauri = { workspace = true, features = ["test"] }

[lints]
workspace = true
