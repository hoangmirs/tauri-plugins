[package]
name = "tauri-plugin-sensors"
description = "Tauri plugin that reads a phone's motion and compass heading, and holds the screen's rotation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
documentation = "https://docs.rs/tauri-plugin-sensors"
readme = "../../README.md"
keywords = ["tauri", "tauri-plugin", "ios", "android", "sensors"]
