[package]
name = "tauri-plugin-purchase"
description = "Tauri plugin that buys and restores one-time purchases through the App Store, the Mac App Store and Google Play"
version = "0.1.0-alpha.4"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
documentation = "https://docs.rs/tauri-plugin-purchase"
readme = "../../README.md"
keywords = ["tauri", "tauri-plugin", "in-app-purchase", "storekit", "billing"]
categories = ["gui"]
links = "tauri-plugin-purchase"

[dependencies]
serde_json.workspace = true
tauri.workspace = true

# The Mac waits on Swift's answer through a oneshot; see `src/macos.rs`.
[target.'cfg(target_os = "macos")'.dependencies]
tokio = { workspace = true, features = ["sync"] }

[build-dependencies]
tauri-plugin = { version = "2.6.3", features = ["build"] }

[dev-dependencies]
tauri = { workspace = true, features = ["test"] }

# The workspace's lints, except `unsafe_code`: the workspace forbids it, and
# the Mac's call into Swift over the C ABI needs it. `deny` keeps it out of
# everything but `src/macos.rs`, which allows it.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = "warn"
pedantic = "warn"
